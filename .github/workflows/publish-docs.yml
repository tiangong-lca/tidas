name: Validate docs

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOCS_SITE_URL: https://tidas.tiangong.earth

jobs:
  validate:
    name: Validate (required check)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint markdown
        run: pnpm lint

      - name: Typecheck (TypeScript 7 native)
        run: pnpm typecheck

      - name: Build (ci fixture) and verify out contract
        env:
          DEPLOY_ENV: ci
          CANONICAL_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_SEARCH_MODE: static
          SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm build
