name: Validate docs

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOCS_SITE_URL: https://tidas.tiangong.earth

jobs:
  validate:
    name: Validate (required check)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The workspace source repository is private, so this job consumes the generated snapshot
      # instead of fetching a private action or holding a token. Check it before installing or
      # building: a snapshot that no longer matches its manifest must fail in seconds, not minutes.
      - name: Check the vendored shared SEO checker against its manifest
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, re, sys
          from pathlib import Path

          folder = Path('scripts/vendor/workspace-seo')
          manifest = json.loads((folder / 'manifest.json').read_text())
          expected = {
              'schema': 1,
              'generated': True,
              'source_repository': 'tiangong-lca/workspace',
              'source_path': 'scripts/seo/check.py',
          }
          problems = [f'{key}={manifest.get(key)!r} but expected {value!r}' for key, value in expected.items() if manifest.get(key) != value]
          if not re.fullmatch(r'[0-9a-f]{40}', str(manifest.get('source_commit', ''))):
              problems.append(f"source_commit={manifest.get('source_commit')!r} is not a full lowercase commit")
          digest = hashlib.sha256((folder / 'check.py').read_bytes()).hexdigest()
          if manifest.get('sha256') != digest:
              problems.append(f"check.py sha256={digest} but the manifest records {manifest.get('sha256')!r}")
          if problems:
              sys.exit('Vendored SEO checker snapshot does not match its manifest: ' + '; '.join(problems))
          print(f"local snapshot bytes match the manifest for {manifest['source_repository']}@{manifest['source_commit']} ({digest})")
          print('manifest identity is a local integrity statement only; origin provenance is attested by the workspace export against the private source commit')
          PYVERIFY

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint markdown
        run: pnpm lint

      - name: Typecheck (TypeScript 7 native)
        run: pnpm typecheck

      - name: Build (ci fixture) and verify out contract
        env:
          DEPLOY_ENV: ci
          CANONICAL_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_SEARCH_MODE: static
          BAIDU_SITE_VERIFICATION: ci-public-baidu-marker
          SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm build

      # Validates the artifacts the step above already produced; it does not rebuild. The snapshot is
      # generated from private root-owned source, so public CI needs no repository credentials.
      - name: Verify SEO artifacts with the shared checker
        run: |
          python3 scripts/vendor/workspace-seo/check.py --root out --origin http://localhost:3000 --artifact-indexing disabled --output "${{ runner.temp }}/seo-report.json"

      # The checker writes a report on every outcome, including an incomplete run, so the evidence is
      # retained even when the step above fails.
      - name: Retain the SEO report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tidas-seo-report
          path: ${{ runner.temp }}/seo-report.json
          if-no-files-found: error
