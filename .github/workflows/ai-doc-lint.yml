name: ai-doc-lint

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref for the manual docpact comparison.
        required: false
        default: origin/main

permissions:
  contents: read

jobs:
  ai-doc-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25

      - name: Install docpact
        run: cargo install docpact --version 0.1.9 --force

      - name: Run local docpact gate
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: scripts/docpact-gate.sh --base "$BASE_REF"
