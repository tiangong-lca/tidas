version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: thursday
      time: "04:30"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      site-runtime-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-tools-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: thursday
      time: "04:45"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
