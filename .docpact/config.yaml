version: 1
layout: repo
lastReviewedAt: "2026-08-23"
lastReviewedCommit: "0c0b5b57c3b499ffeb827c8f5911519acb6f4050"

catalog:
  repos:
    - id: tidas
      path: .
      canonicalRepo: tiangong-lca/tidas
      entryDoc: AGENTS.md
      workflowDocs:
        - _docs/agents/repo-validation.md
        - _docs/agents/repo-architecture.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - .docpact/**
          - _docs/agents/**
          - .github/workflows/ai-doc-lint.yml
      ownerRepo: tidas
    - id: public-spec-and-schema-surface
      paths:
        include:
          - content/docs/**
          - public/schemas/**
      ownerRepo: tidas
    - id: site-runtime-and-publication
      paths:
        include:
          - package.json
          - package-lock.json
          - .nvmrc
          - .markdownlint.json
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - next.config.ts
          - postcss.config.mjs
          - tsconfig.json
          - edgeone.json
          - crowdin.yml
          - context7.json
          - app/**
          - components/**
          - lib/**
          - public/assets/**
          - public/img/**
          - public/favicon.ico
          - public/logo-*.svg
          - scripts/build.mjs
          - scripts/check-env.mjs
          - scripts/verify-out.mjs
          - scripts/verify-site.mjs
          - scripts/migrate.mjs
          - manifests/migration-report.json
          - .github/workflows/publish-docs.yml
      ownerRepo: tidas
    - id: local-docpact-push-gate
      paths:
        include:
          - .githooks/**
          - scripts/docpact
          - scripts/docpact-gate.sh
          - scripts/install-git-hooks.sh
      ownerRepo: tidas

coverage:
  include:
    - AGENTS.md
    - README.md
    - .docpact/**
    - _docs/agents/**
    - .github/workflows/**
    - .githooks/**
    - package.json
    - package-lock.json
    - .nvmrc
    - .markdownlint.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - next.config.ts
    - postcss.config.mjs
    - tsconfig.json
    - edgeone.json
    - crowdin.yml
    - context7.json
    - app/**
    - components/**
    - lib/**
    - content/docs/**
    - public/**
    - scripts/**
    - manifests/migration-report.json
  exclude:
    - .git/**
    - node_modules/**
    - .next/**
    - out/**
    - .source/**
    - next-env.d.ts
    - "*.tsbuildinfo"

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    local-docpact-gate:
      paths:
        - .githooks/pre-push
        - scripts/docpact
        - scripts/docpact-gate.sh
        - scripts/install-git-hooks.sh
    docs-site:
      paths:
        - content/docs/**
    schema-docs:
      paths:
        - content/docs/core-modules/schema/**
        - components/json-schema-viewer.tsx
        - public/schemas/**
    tooling-guidance:
      paths:
        - content/docs/tool/**
        - content/docs/integration/**
        - content/docs/use-case/**
    published-schemas:
      paths:
        - public/schemas/**
    site-runtime:
      paths:
        - package.json
        - package-lock.json
        - pnpm-lock.yaml
        - next.config.ts
        - edgeone.json
        - app/**
        - components/**
        - lib/**
        - scripts/build.mjs
        - scripts/check-env.mjs
        - scripts/verify-out.mjs
        - scripts/verify-site.mjs
        - scripts/migrate.mjs
        - manifests/migration-report.json
        - .github/workflows/publish-docs.yml
    proof:
      paths:
        - _docs/agents/repo-validation.md
        - package.json
        - app/**
        - components/**
        - content/docs/**
        - public/schemas/**
        - scripts/verify-*.mjs
        - .github/workflows/publish-docs.yml
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - .docpact/**
        - _docs/agents/**
    root-integration:
      paths:
        - AGENTS.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - _docs/agents/repo-validation.md
    - _docs/agents/repo-architecture.md

repo:
  id: tidas
  owner: tidas

rules:
  - id: tidas-bootstrap-contract
    scope: repo
    repo: tidas
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/**
        kind: doc-ai-layer
      - path: _docs/agents/repo-validation.md
        kind: deep-doc
      - path: _docs/agents/repo-architecture.md
        kind: deep-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/agents/repo-validation.md
        mode: review_or_update
      - path: _docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Repository policy, machine-readable governance, architecture, and proof guidance must remain aligned.
  - id: tidas-readme-contract
    scope: repo
    repo: tidas
    triggers:
      - path: README.md
        kind: repo-landing
    requiredDocs:
      - path: AGENTS.md
        mode: must_exist
      - path: .docpact/config.yaml
        mode: must_exist
    reason: Contributor-facing setup must retain the repository contract and governed entrypoint.
  - id: tidas-public-spec-contract
    scope: repo
    repo: tidas
    triggers:
      - path: content/docs/**
        kind: public-doc
      - path: public/schemas/**
        kind: published-schema
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/agents/repo-validation.md
        mode: review_or_update
      - path: _docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Public specification and Schema changes must retain ownership, path, architecture, and proof alignment.
  - id: tidas-site-runtime-contract
    scope: repo
    repo: tidas
    triggers:
      - path: package.json
        kind: site-runtime
      - path: package-lock.json
        kind: retired-package-manager-lock
      - path: .nvmrc
        kind: site-runtime-config
      - path: .markdownlint.json
        kind: site-proof-config
      - path: pnpm-lock.yaml
        kind: site-runtime-config
      - path: pnpm-workspace.yaml
        kind: site-runtime-config
      - path: postcss.config.mjs
        kind: site-runtime-config
      - path: tsconfig.json
        kind: site-runtime-config
      - path: context7.json
        kind: documentation-index-config
      - path: next.config.ts
        kind: site-config
      - path: edgeone.json
        kind: site-publication-config
      - path: crowdin.yml
        kind: translation-config
      - path: app/**
        kind: site-runtime
      - path: components/**
        kind: site-runtime
      - path: lib/**
        kind: site-runtime
      - path: public/assets/**
        kind: site-media
      - path: public/img/**
        kind: site-media
      - path: public/favicon.ico
        kind: site-media
      - path: public/logo-*.svg
        kind: site-media
      - path: scripts/build.mjs
        kind: site-build
      - path: scripts/check-env.mjs
        kind: site-build
      - path: scripts/verify-out.mjs
        kind: site-proof
      - path: scripts/verify-site.mjs
        kind: site-proof
      - path: scripts/migrate.mjs
        kind: retired-migration-tool
      - path: manifests/migration-report.json
        kind: retired-migration-artifact
      - path: .github/workflows/publish-docs.yml
        kind: site-validation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/agents/repo-validation.md
        mode: review_or_update
      - path: _docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Runtime, localization, build, quality, and publication changes alter public behavior and required proof.
  - id: tidas-doc-maintenance-contract
    scope: repo
    repo: tidas
    triggers:
      - path: .github/workflows/ai-doc-lint.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/agents/repo-validation.md
        mode: review_or_update
    reason: Remote governance reproduction must stay aligned with repository policy and proof guidance.
  - id: tidas-local-docpact-push-gate
    scope: repo
    repo: tidas
    triggers:
      - path: .githooks/pre-push
        kind: local-git-hook
      - path: scripts/docpact
        kind: local-automation
      - path: scripts/docpact-gate.sh
        kind: local-automation
      - path: scripts/install-git-hooks.sh
        kind: local-automation
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/agents/repo-validation.md
        mode: review_or_update
    reason: Local governance enforcement must stay aligned with its machine-readable contract and validation guidance.
