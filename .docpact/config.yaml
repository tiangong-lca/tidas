version: 1
layout: repo
lastReviewedAt: "2026-09-21"
lastReviewedCommit: "866b5d3d8c7bd3f1fd6e026d92c184304314c610"
lastReviewedNote: "Reviewed for TIDAS #81: active public guidance uses the canonical tidas-toolkit repository and release URLs in all four locales; explicit legacy-command migration tables remain historical mappings. Schema assets, routes, executable behavior, packages, and publication contracts are unchanged."
# Review note, 2026-08-30: the beginner-facing terminology update adds a localized glossary and plain-language homepage, introduction, core, tool, and Schema inventory copy. Existing content/docs/**, components/**, and scripts/*.test.mjs coverage and required governed-document review remain sufficient.
# Review note, 2026-09-17: TIDAS #78 resolves W6b/A09 against exact `tidas-spec` candidate `6fb497bad562125ccc0c00a803351207b9ed438f`: all 18 normative website schema assets are byte-identical, the viewer projection remains non-normative, and source/manifest drift fails closed without changing public schema URLs, publication, navigation, or ownership boundaries.
# Review note, 2026-08-30: Issue #61 keeps the existing ownership and rule graph while separating the local Node 24 selector, bounded runtime validation, EdgeOne's preinstalled 24.18.0 pin, and the reviewed PR CI runtime.
# Historical review note, 2026-08-25: Issue #56 confirmed that the existing ownership, scripts/*.mjs coverage, routing, and site-runtime rules governed the exact Node 24.19.0, pnpm 11.23.0, and TypeScript 7.0.2 toolchain and its Node contracts.
# Review note, 2026-08-26: Issue #58 only advances the current pnpm contract from 11.23.0 to 11.24.0. Existing site-runtime ownership, scripts/*.mjs and workflow coverage, routed governed documents, and proof rules already own the manifest, environment checker, tests, CI bootstrap, root workspace/lock, and active documentation; no ownership or routing change is required.

catalog:
  repos:
    - id: tidas
      path: .
      canonicalRepo: tiangong-lca/tidas
      entryDoc: AGENTS.md
      workflowDocs:
        - _docs/agents/repo-validation.md
        - _docs/agents/repo-architecture.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - .docpact/**
          - _docs/agents/**
          - .github/workflows/ai-doc-lint.yml
      ownerRepo: tidas
    - id: public-spec-and-schema-surface
      paths:
        include:
          - content/schema-inventory.json
          - content/docs/**
          - public/schemas/**
          - public/spec/**
          - scripts/spec-pin.json
      ownerRepo: tidas
    - id: site-runtime-and-publication
      paths:
        include:
          - package.json
          - .nvmrc
          - .markdownlint.json
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - next.config.ts
          - postcss.config.mjs
          - tsconfig.json
          - .gitignore
          - .gitattributes
          - edgeone.json
          - crowdin.yml
          - context7.json
          - app/**
          - components/**
          - lib/**
          - public/assets/**
          - public/img/**
          - public/favicon.ico
          - public/logo-*.svg
          - scripts/build.mjs
          - scripts/check-env.mjs
          - scripts/*.test.mjs
          - scripts/verify-out.mjs
          - scripts/verify-site.mjs
          - .github/workflows/publish-docs.yml
      ownerRepo: tidas
    - id: local-docpact-push-gate
      paths:
        include:
          - .githooks/**
          - scripts/docpact
          - scripts/docpact-gate.sh
          - scripts/install-git-hooks.sh
      ownerRepo: tidas

coverage:
  include:
    - AGENTS.md
    - README.md
    - .docpact/**
    - _docs/agents/**
    - .github/workflows/**
    - .githooks/**
    - package.json
    - .nvmrc
    - .markdownlint.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - next.config.ts
    - postcss.config.mjs
    - tsconfig.json
    - .gitignore
    - .gitattributes
    - edgeone.json
    - crowdin.yml
    - context7.json
    - app/**
    - components/**
    - lib/**
    - content/docs/**
    - content/schema-inventory.json
    - public/**
    - scripts/**
  exclude:
    - .git/**
    - node_modules/**
    - .next/**
    - out/**
    - .source/**
    - next-env.d.ts
    - "*.tsbuildinfo"

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    local-docpact-gate:
      paths:
        - .githooks/pre-push
        - scripts/docpact
        - scripts/docpact-gate.sh
        - scripts/install-git-hooks.sh
    docs-site:
      paths:
        - content/docs/**
    schema-docs:
      paths:
        - content/schema-inventory.json
        - content/docs/core-modules/schema/**
        - components/json-schema-viewer.tsx
        - public/schemas/**
        - public/spec/**
    tooling-guidance:
      paths:
        - content/docs/tool/**
        - content/docs/integration/**
        - content/docs/use-case/**
    published-schemas:
      paths:
        - content/schema-inventory.json
        - public/schemas/**
        - public/spec/**
    site-runtime:
      paths:
        - package.json
        - pnpm-lock.yaml
        - next.config.ts
        - edgeone.json
        - app/**
        - components/**
        - lib/**
        - scripts/build.mjs
        - scripts/check-env.mjs
        - scripts/*.test.mjs
        - scripts/verify-out.mjs
        - scripts/verify-site.mjs
        - .github/workflows/publish-docs.yml
    proof:
      paths:
        - _docs/agents/repo-validation.md
        - package.json
        - app/**
        - components/**
        - content/schema-inventory.json
        - content/docs/**
        - public/schemas/**
        - public/spec/**
        - scripts/*.test.mjs
        - scripts/verify-*.mjs
        - .github/workflows/publish-docs.yml
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - .docpact/**
        - _docs/agents/**
    root-integration:
      paths:
        - AGENTS.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - _docs/agents/repo-validation.md
    - _docs/agents/repo-architecture.md

repo:
  id: tidas
  owner: tidas

rules:
  - id: tidas-bootstrap-contract
    scope: repo
    repo: tidas
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/**
        kind: doc-ai-layer
      - path: _docs/agents/repo-validation.md
        kind: deep-doc
      - path: _docs/agents/repo-architecture.md
        kind: deep-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/agents/repo-validation.md
        mode: review_or_update
      - path: _docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Repository policy, machine-readable governance, architecture, and proof guidance must remain aligned.
  - id: tidas-spec-difference-ledger
    scope: repo
    repo: tidas
    triggers:
      - path: _docs/agents/tidas-spec-difference-ledger.md
        kind: deep-doc
      - path: _docs/agents/tidas-spec-difference-ledger.json
        kind: evidence-ledger
      - path: scripts/ci/compare-tidas-spec.mjs
        kind: validation-script
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/agents/repo-validation.md
        mode: review_or_update
      - path: _docs/agents/repo-architecture.md
        mode: review_or_update
    reason: The W6a/A09 semantic-difference ledger must remain reproducible and must not be mistaken for a public asset or website cutover.
  - id: tidas-readme-contract
    scope: repo
    repo: tidas
    triggers:
      - path: README.md
        kind: repo-landing
    requiredDocs:
      - path: AGENTS.md
        mode: must_exist
      - path: .docpact/config.yaml
        mode: must_exist
    reason: Contributor-facing setup must retain the repository contract and governed entrypoint.
  - id: tidas-public-spec-contract
    scope: repo
    repo: tidas
    triggers:
      - path: content/docs/**
        kind: public-doc
      - path: content/schema-inventory.json
        kind: schema-inventory
      - path: public/schemas/**
        kind: published-schema
      - path: public/spec/**
        kind: published-spec-release
      - path: scripts/spec-pin.json
        kind: published-spec-pin
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/agents/repo-validation.md
        mode: review_or_update
      - path: _docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Public specification and Schema changes must retain ownership, path, architecture, and proof alignment.
  - id: tidas-site-runtime-contract
    scope: repo
    repo: tidas
    triggers:
      - path: package*.json
        kind: site-runtime
      - path: .nvmrc
        kind: site-runtime-config
      - path: .markdownlint.json
        kind: site-proof-config
      - path: pnpm-lock.yaml
        kind: site-runtime-config
      - path: pnpm-workspace.yaml
        kind: site-runtime-config
      - path: postcss.config.mjs
        kind: site-runtime-config
      - path: tsconfig.json
        kind: site-runtime-config
      - path: .gitignore
        kind: site-runtime-config
      - path: context7.json
        kind: documentation-index-config
      - path: next.config.ts
        kind: site-config
      - path: edgeone.json
        kind: site-publication-config
      - path: crowdin.yml
        kind: translation-config
      - path: app/**
        kind: site-runtime
      - path: components/**
        kind: site-runtime
      - path: lib/**
        kind: site-runtime
      - path: public/assets/**
        kind: site-media
      - path: public/img/**
        kind: site-media
      - path: public/favicon.ico
        kind: site-media
      - path: public/logo-*.svg
        kind: site-media
      - path: scripts/*.mjs
        kind: site-build-and-proof
      - path: scripts/ci/*.mjs
        kind: site-build-and-proof
      - path: scripts/vendor/workspace-seo/**
        kind: generated-build-and-proof
      - path: .gitattributes
        kind: generated-snapshot-encoding
      - path: manifests/**
        kind: retired-artifact-removal
      - path: .github/workflows/publish-docs.yml
        kind: site-validation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/agents/repo-validation.md
        mode: review_or_update
      - path: _docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Runtime, localization, build, quality, and publication changes alter public behavior and required proof.
  - id: tidas-doc-maintenance-contract
    scope: repo
    repo: tidas
    triggers:
      - path: .github/workflows/ai-doc-lint.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/agents/repo-validation.md
        mode: review_or_update
    reason: Remote governance reproduction must stay aligned with repository policy and proof guidance.
  - id: tidas-local-docpact-push-gate
    scope: repo
    repo: tidas
    triggers:
      - path: .githooks/pre-push
        kind: local-git-hook
      - path: scripts/docpact
        kind: local-automation
      - path: scripts/docpact-gate.sh
        kind: local-automation
      - path: scripts/install-git-hooks.sh
        kind: local-automation
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/agents/repo-validation.md
        mode: review_or_update
    reason: Local governance enforcement must stay aligned with its machine-readable contract and validation guidance.
